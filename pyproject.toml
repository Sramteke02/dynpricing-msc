[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynpricing"
version = "0.1.0"
description = "Data-driven dynamic pricing in a competitive e-commerce simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MSc Project" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
llm = ["openai>=1.0"]
track = ["wandb>=0.16"]
app = ["streamlit>=1.30", "altair>=5.0"]   # live dashboard: app/dashboard.py
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
dynpricing = "dynpricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
